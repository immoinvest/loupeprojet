# Comptes Deklic : API d'authentification (Better Auth) servie sur l'origine du site.
# En production, ce code est bundlé dans apps/web/dist/_worker.js par le build de apps/web et déployé
# avec le site sur Cloudflare Pages (bindings et secrets : apps/web/wrangler.toml ou tableau de bord Pages).
# En local : `npm run dev -w apps/comptes` (D1 locale automatique, secrets dans .dev.vars).
# Base D1 de production : `npx wrangler d1 create deklic-comptes --location weur` puis reporter l'id ci-dessous,
# puis `npx wrangler d1 migrations apply deklic-comptes --remote` depuis apps/comptes.
name = "loupe-comptes"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[vars]
ENVIRONNEMENT = "dev"

[[d1_databases]]
binding = "DB"
database_name = "deklic-comptes"
database_id = "a-remplacer-par-l-id-cree-avec-wrangler"
migrations_dir = "migrations"
