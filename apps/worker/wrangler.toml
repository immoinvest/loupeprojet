# Worker Loupe : proxy des données publiques (cache KV, limite de débit) ; /extract viendra ensuite.
# Déploiement : `npx wrangler login` puis `npm run deploy -w apps/worker`.
# L'espace KV_CACHE a été créé le 13/09/2026 sur le compte Cloudflare de Pierre (`wrangler kv namespace create KV_CACHE`).
name = "loupe-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
ENVIRONNEMENT = "production"
# Lecture des annonces par un modèle de langage (compatible « chat completions ») ; la clé est un secret :
# `npx wrangler secret put OPENROUTER_API_KEY`. Sans clé, /extract répond EXTRACTION_INDISPONIBLE.
LLM_URL = "https://openrouter.ai/api/v1/chat/completions"
LLM_MODELE = "nvidia/nemotron-3-super-120b-a12b:free"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "a64f32a40a0846e1be258a7ea34a8090"

# 60 requêtes par minute et par adresse IP sur /proxy/* (le namespace_id est un entier libre, unique par worker).
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 10 lectures d'annonce par minute et par adresse IP (une analyse = une lecture).
[[ratelimits]]
name = "LIMITEUR_EXTRACTION"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
